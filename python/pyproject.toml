[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veval-sdk"
version = "1.0.0"
description = "Trace, evaluate, and test AI agents with a few lines of code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai", "agents", "llm", "evaluation", "testing", "tracing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["veval"]

[project.urls]
Homepage = "https://veval.dev"
Documentation = "https://veval.dev/docs"
Repository = "https://github.com/veval-dev/veval-sdk-python"
